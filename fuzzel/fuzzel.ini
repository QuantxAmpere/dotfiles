# Fuzzel colors come from the active system theme (system-theme repo).
include=~/.config/system-theme/current/fuzzel-theme.conf

[main]
# Twice the default size (default font is monospace at the fontconfig default
# size): the padding is in pixels, so it is doubled by hand to keep the whole
# window at 2x instead of only the glyphs.
font=monospace:size=24
horizontal-pad=80
vertical-pad=16
