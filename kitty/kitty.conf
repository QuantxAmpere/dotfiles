# Native Kitty config. Edit settings here; no Nix rebuild required.

# The selected system theme is applied by ~/system-theme/bin/theme.
include ${HOME}/.config/system-theme/current/kitty-theme.conf

# Default (kitty's built-in) is 11.0.
font_size 14.0

# Zoom only the active top-level OS window, not all of them.
map ctrl+shift+equal change_font_size current +2.0
map ctrl+shift+plus change_font_size current +2.0
map ctrl+shift+kp_add change_font_size current +2.0
map ctrl+shift+minus change_font_size current -2.0
map ctrl+shift+kp_subtract change_font_size current -2.0
map ctrl+shift+backspace change_font_size current 0

window_padding_width 1

# Use zsh even when the desktop session predates the login-shell change.
shell /run/current-system/sw/bin/zsh
